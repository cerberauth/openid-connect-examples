name: Provision StubIdP Clients

on:
  workflow_dispatch:
    inputs:
      client:
        description: Client to provision (or "all")
        type: string
        default: all

permissions:
  contents: read

jobs:
  list-clients:
    runs-on: ubuntu-slim

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - id: set-matrix
        run: |
          if [ "${{ inputs.client }}" = "all" ]; then
            matrix=$(jq -c '[.[].key]' .github/stubidp/clients.json)
          else
            matrix=$(jq -c --arg key "${{ inputs.client }}" '[.[] | select(.key == $key) | .key]' .github/stubidp/clients.json)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  provision:
    needs: list-clients
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        key: ${{ fromJson(needs.list-clients.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Read client config
        id: config
        run: |
          config=$(jq -c --arg key "${{ matrix.key }}" '.[] | select(.key == $key)' .github/stubidp/clients.json)
          echo "secret-prefix=$(jq -r '.secretPrefix' <<< "$config")" >> "$GITHUB_OUTPUT"
          echo "public=$(jq -r '.public' <<< "$config")" >> "$GITHUB_OUTPUT"
          echo "vercel-project=$(jq -r '.vercelProject // empty' <<< "$config")" >> "$GITHUB_OUTPUT"
          echo "vercel-client-id-env-var=$(jq -r '.vercelClientIdEnvVar // empty' <<< "$config")" >> "$GITHUB_OUTPUT"
          echo "vercel-client-secret-env-var=$(jq -r '.vercelClientSecretEnvVar // empty' <<< "$config")" >> "$GITHUB_OUTPUT"

      - name: Provision client on stubIdP
        id: provision
        env:
          CLIENT_KEY: ${{ matrix.key }}
          STUBIDP_REGISTRATION_INITIAL_ACCESS_TOKEN: ${{ secrets.STUBIDP_REGISTRATION_INITIAL_ACCESS_TOKEN }}
          EXISTING_CLIENT_ID: ${{ secrets[format('STUBIDP_{0}_CLIENT_ID', steps.config.outputs.secret-prefix)] }}
          EXISTING_REGISTRATION_ACCESS_TOKEN: ${{ secrets[format('STUBIDP_{0}_REG_TOKEN', steps.config.outputs.secret-prefix)] }}
        run: node scripts/stubidp/provision-client.mjs

      - name: Persist client credentials as repo secrets
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          PREFIX: ${{ steps.config.outputs.secret-prefix }}
          CLIENT_ID: ${{ steps.provision.outputs.client_id }}
          CLIENT_SECRET: ${{ steps.provision.outputs.client_secret }}
          REG_TOKEN: ${{ steps.provision.outputs.registration_access_token }}
          IS_PUBLIC: ${{ steps.config.outputs.public }}
        run: |
          gh secret set "STUBIDP_${PREFIX}_CLIENT_ID" --body "$CLIENT_ID"
          gh secret set "STUBIDP_${PREFIX}_REG_TOKEN" --body "$REG_TOKEN"
          if [ "$IS_PUBLIC" != "true" ] && [ -n "$CLIENT_SECRET" ]; then
            gh secret set "STUBIDP_${PREFIX}_CLIENT_SECRET" --body "$CLIENT_SECRET"
          fi

      - name: Push client credentials to Vercel
        if: steps.config.outputs.vercel-project != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT: ${{ steps.config.outputs.vercel-project }}
          CLIENT_ID: ${{ steps.provision.outputs.client_id }}
          CLIENT_SECRET: ${{ steps.provision.outputs.client_secret }}
          CLIENT_ID_ENV_VAR: ${{ steps.config.outputs.vercel-client-id-env-var }}
          CLIENT_SECRET_ENV_VAR: ${{ steps.config.outputs.vercel-client-secret-env-var }}
        run: node scripts/stubidp/sync-vercel-env.mjs
