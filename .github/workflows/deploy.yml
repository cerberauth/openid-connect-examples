name: Deploy

on:
  push:
    branches:
      - main

jobs:
  list-wrangler-examples:
    runs-on: ubuntu-slim

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - id: set-matrix
        uses: ./.github/actions/list-examples
        with:
          marker-file: wrangler.jsonc
          exclude: nextjs-app

  deploy-nodejs-cloudflare-workers:
    needs: list-wrangler-examples
    name: Deploy ${{ matrix.workingDirectory }} to Cloudflare Workers
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.workingDirectory }}

    strategy:
      fail-fast: false
      matrix:
        workingDirectory: ${{ fromJson(needs.list-wrangler-examples.outputs.matrix) }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.workingDirectory }}/package-lock.json'

      - name: Install dependencies 👨🏻‍💻
        run: npm ci

      - name: Resolve stubIdP client config
        id: stubidp
        run: |
          key=$(basename "${{ matrix.workingDirectory }}")
          config=$(jq -c --arg key "$key" '.[] | select(.key == $key)' "$GITHUB_WORKSPACE/.github/stubidp/clients.json")
          echo "secret-prefix=$(jq -r '.secretPrefix // empty' <<< "$config")" >> "$GITHUB_OUTPUT"
          echo "cloudflare-worker=$(jq -r '.cloudflareWorker // empty' <<< "$config")" >> "$GITHUB_OUTPUT"

      - name: Run build
        env:
          VITE_OIDC_CLIENT_ID: ${{ secrets[format('STUBIDP_{0}_CLIENT_ID', steps.stubidp.outputs.secret-prefix)] }}
        run: npm run build

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.workingDirectory }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Push client credentials to Cloudflare Worker
        if: steps.stubidp.outputs.cloudflare-worker != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ secrets[format('STUBIDP_{0}_CLIENT_ID', steps.stubidp.outputs.secret-prefix)] }}
          CLIENT_SECRET: ${{ secrets[format('STUBIDP_{0}_CLIENT_SECRET', steps.stubidp.outputs.secret-prefix)] }}
        run: |
          printf '%s' "$CLIENT_ID" | \
            npx wrangler secret put AUTH_CLIENT_ID --name "${{ steps.stubidp.outputs.cloudflare-worker }}"
          if [ -n "$CLIENT_SECRET" ]; then
            printf '%s' "$CLIENT_SECRET" | \
              npx wrangler secret put AUTH_CLIENT_SECRET --name "${{ steps.stubidp.outputs.cloudflare-worker }}"
          fi

  list-vercel-examples:
    runs-on: ubuntu-slim

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - id: set-matrix
        uses: ./.github/actions/list-examples
        with:
          marker-file: vercel.json

  deploy-vercel:
    needs: list-vercel-examples
    name: Deploy ${{ matrix.workingDirectory }} to Vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.workingDirectory }}

    strategy:
      fail-fast: false
      matrix:
        workingDirectory: ${{ fromJson(needs.list-vercel-examples.outputs.matrix) }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Resolve stubIdP client config
        id: stubidp
        run: |
          key=$(basename "${{ matrix.workingDirectory }}")
          config=$(jq -c --arg key "$key" '.[] | select(.key == $key)' "$GITHUB_WORKSPACE/.github/stubidp/clients.json")
          echo "vercel-project=$(jq -r '.vercelProject // empty' <<< "$config")" >> "$GITHUB_OUTPUT"

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(--yes --token="$VERCEL_TOKEN" --project="${{ steps.stubidp.outputs.vercel-project }}")
          if [ -n "${{ secrets.VERCEL_TEAM_ID }}" ]; then
            args+=(--scope="${{ secrets.VERCEL_TEAM_ID }}")
          fi
          npx vercel link "${args[@]}"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --token="$VERCEL_TOKEN"

  # Deprecated deployments
  deploy-nodejs-cloudflare-pages:
    name: Deploy ${{ matrix.workingDirectory }} to Cloudflare Pages
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.workingDirectory }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - workingDirectory: ./examples/react-spa
            projectName: cerberauth-react-spa-oidc
            directory: ./dist/client
          - workingDirectory: ./examples/vue-spa
            projectName: cerberauth-vue-spa-oidc
            directory: ./dist
          - workingDirectory: ./examples/angular-spa
            projectName: cerberauth-angular-spa-oidc
            directory: ./dist/angular-spa/browser
          - workingDirectory: ./examples/nextjs-app
            projectName: cerberauth-nextjs-app-oidc
            directory: ./.vercel/output/static

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.workingDirectory }}/package-lock.json'

      - name: Install dependencies 👨🏻‍💻
        run: npm ci

      - name: Resolve stubIdP client id
        id: stubidp
        run: |
          key=$(basename "${{ matrix.workingDirectory }}")
          prefix=$(jq -r --arg key "$key" '.[] | select(.key == $key) | .secretPrefix // empty' "$GITHUB_WORKSPACE/.github/stubidp/clients.json")
          echo "secret-prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Inject stubIdP client id into Angular environment
        if: matrix.workingDirectory == './examples/angular-spa'
        env:
          CLIENT_ID: ${{ secrets[format('STUBIDP_{0}_CLIENT_ID', steps.stubidp.outputs.secret-prefix)] }}
        run: |
          sed -i "s#clientId: '[^']*'#clientId: '${CLIENT_ID}'#" src/environments/environment.ts

      - name: Run build
        env:
          VITE_OIDC_CLIENT_ID: ${{ secrets[format('STUBIDP_{0}_CLIENT_ID', steps.stubidp.outputs.secret-prefix)] }}
        run: npm run pages:build

      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.workingDirectory }}
          command: pages deploy ${{ matrix.directory }} --project-name=${{ matrix.projectName }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Push client credentials to Cloudflare Pages
        if: matrix.workingDirectory == './examples/nextjs-app'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_ID: ${{ secrets[format('STUBIDP_{0}_CLIENT_ID', steps.stubidp.outputs.secret-prefix)] }}
          CLIENT_SECRET: ${{ secrets[format('STUBIDP_{0}_CLIENT_SECRET', steps.stubidp.outputs.secret-prefix)] }}
        run: |
          printf '%s' "$CLIENT_ID" | \
            npx wrangler pages secret put AUTH_CLIENT_ID --project-name="${{ matrix.projectName }}"
          if [ -n "$CLIENT_SECRET" ]; then
            printf '%s' "$CLIENT_SECRET" | \
              npx wrangler pages secret put AUTH_CLIENT_SECRET --project-name="${{ matrix.projectName }}"
          fi
