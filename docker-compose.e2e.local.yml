services:
  stubidp-angular:
    image: ghcr.io/cerberauth/stubidp:latest
    command: []
    environment:
      STUBIDP_PORT: "8481"
      STUBIDP_CLIENT_ID: e2e-test-client
      STUBIDP_PUBLIC_CLIENT: "true"
      STUBIDP_SKIP_PROMPT: "true"
      STUBIDP_REDIRECT_URI: http://localhost:4001/index.html
      STUBIDP_POST_LOGOUT_REDIRECT_URI: http://localhost:4001/index.html
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8481/.well-known/openid-configuration', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  stubidp-react:
    image: ghcr.io/cerberauth/stubidp:latest
