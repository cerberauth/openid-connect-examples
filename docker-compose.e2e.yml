name: openid-connect-e2e

# Run all services:   docker compose -f docker-compose.e2e.yml up --build -d
# Run single app:     docker compose -f docker-compose.e2e.yml up --build -d stubidp-react react-spa
# Teardown:           docker compose -f docker-compose.e2e.yml down
#
# Note: nextjs-app and hono-app use network_mode: host (Linux only).
# On macOS/Windows Docker Desktop, those two apps may not work correctly.

services:
  # ─── Angular SPA ────────────────────────────────────────────────────────────
  stubidp-angular:
    image: node:jod-alpine
    command: >
      sh -c "npx --yes @cerberauth/stubidp
      --port 8481
      --client-id e2e-test-client
      --client-secret e2e-test-secret
      --skip-prompt
      --redirect-uri http://localhost:4001/index.html"
    ports:
      - "8481:8481"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8481/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 12

  angular-spa:
    build:
      context: ./examples/angular-spa
      args:
        NG_CONFIGURATION: e2e
    ports:
      - "4001:80"
    depends_on:
      stubidp-angular:
        condition: service_healthy

  # ─── React SPA ──────────────────────────────────────────────────────────────
  stubidp-react:
    image: node:jod-alpine
    command: >
      sh -c "npx --yes @cerberauth/stubidp
      --port 8482
      --client-id e2e-test-client
      --client-secret e2e-test-secret
      --skip-prompt
      --redirect-uri http://localhost:4002"
    ports:
      - "8482:8482"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8482/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 12

  react-spa:
    build:
      context: ./examples/react-spa
      args:
        VITE_OIDC_ISSUER: http://localhost:8482
        VITE_OIDC_CLIENT_ID: e2e-test-client
    ports:
      - "4002:80"
    depends_on:
      stubidp-react:
        condition: service_healthy

  # ─── Vue SPA ────────────────────────────────────────────────────────────────
  stubidp-vue:
    image: node:jod-alpine
    command: >
      sh -c "npx --yes @cerberauth/stubidp
      --port 8483
      --client-id e2e-test-client
      --client-secret e2e-test-secret
      --skip-prompt
      --redirect-uri http://localhost:4003"
    ports:
      - "8483:8483"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8483/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 12

  vue-spa:
    build:
      context: ./examples/vue-spa
      args:
        VITE_OIDC_ISSUER: http://localhost:8483
        VITE_OIDC_CLIENT_ID: e2e-test-client
    ports:
      - "4003:80"
    depends_on:
      stubidp-vue:
        condition: service_healthy

  # ─── Next.js App ────────────────────────────────────────────────────────────
  # Uses network_mode: host so the container can reach stubidp on localhost:8484.
  stubidp-nextjs:
    image: node:jod-alpine
    command: >
      sh -c "npx --yes @cerberauth/stubidp
      --port 8484
      --client-id e2e-test-client
      --client-secret e2e-test-secret
      --skip-prompt
      --redirect-uri http://localhost:4004/api/auth/callback/testid"
    ports:
      - "8484:8484"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8484/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 12

  nextjs-app:
    build:
      context: ./examples/nextjs-app
    network_mode: host
    environment:
      PORT: "4004"
      AUTH_ISSUER: http://localhost:8484
      AUTH_CLIENT_ID: e2e-test-client
      AUTH_CLIENT_SECRET: e2e-test-secret
      AUTH_SECRET: e2e-nextauth-secret-32-chars!!!
    depends_on:
      stubidp-nextjs:
        condition: service_healthy

  # ─── Hono App ───────────────────────────────────────────────────────────────
  # Uses network_mode: host so the container can reach stubidp on localhost:8485.
  stubidp-hono:
    image: node:jod-alpine
    command: >
      sh -c "npx --yes @cerberauth/stubidp
      --port 8485
      --client-id e2e-test-client
      --client-secret e2e-test-secret
      --skip-prompt
      --redirect-uri http://localhost:4005/auth/callback"
    ports:
      - "8485:8485"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8485/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 12

  hono-app:
    build:
      context: ./examples/hono-app
    network_mode: host
    environment:
      PORT: "4005"
      AUTH_ISSUER: http://localhost:8485
      AUTH_CLIENT_ID: e2e-test-client
      AUTH_CLIENT_SECRET: e2e-test-secret
      AUTH_REDIRECT_URI: http://localhost:4005/auth/callback
      AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:4005/
    depends_on:
      stubidp-hono:
        condition: service_healthy

  # ─── Nuxt App ───────────────────────────────────────────────────────────────
  # Uses network_mode: host so the container can reach stubidp on localhost:8486.
  stubidp-nuxt:
    image: node:jod-alpine
    command: >
      sh -c "npx --yes @cerberauth/stubidp
      --port 8486
      --client-id e2e-test-client
      --client-secret e2e-test-secret
      --skip-prompt
      --redirect-uri http://localhost:4006/auth/oidc"
    ports:
      - "8486:8486"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8486/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 12

  nuxt-app:
    build:
      context: ./examples/nuxt-app
    network_mode: host
    environment:
      PORT: "4006"
      NUXT_SESSION_PASSWORD: "e2e-nuxt-session-password-32chars!!"
      NUXT_OAUTH_OIDC_CLIENT_ID: e2e-test-client
      NUXT_OAUTH_OIDC_CLIENT_SECRET: e2e-test-secret
      NUXT_OAUTH_OIDC_OPENID_CONFIG: http://localhost:8486/.well-known/openid-configuration
      NUXT_OAUTH_OIDC_REDIRECT_URL: http://localhost:4006/auth/oidc
    depends_on:
      stubidp-nuxt:
        condition: service_healthy
